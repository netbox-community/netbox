{% load i18n %}
{% load l10n %}
<span>{{ value|linebreaksbr }}</span>
{% if map_url or copy_button %}
  <div class="d-flex gap-1">
    {% if map_url %}
      <a href="{{ map_url }}{{ value }}" target="_blank" class="btn btn-primary btn-sm print-none">
        <i class="mdi mdi-map-marker"></i> {% trans "Map" %}
      </a>
    {% endif %}
    {% if copy_button %}
      <a class="btn btn-sm btn-primary copy-content d-print-none" data-clipboard-text="{{ value }}" title="{% trans "Copy to clipboard" %}">
        <i class="mdi mdi-content-copy"></i>
      </a>
    {% endif %}
  </div>
{% endif %}

{% load static %}
{% comment %}
  This template derives from the strawberry-graphql project:
  https://github.com/strawberry-graphql/strawberry/blob/main/strawberry/static/graphiql.html
{% endcomment %}
<!DOCTYPE html>
<html>
  <head>
    <title>GraphiQL | NetBox</title>
    <link
      rel="icon"
      href="data:image/svg+xml,
        <svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
            <!-- Strawberry Emoji as a HTML Entity (hex)  -->
            <text y=%22.9em%22 font-size=%2280%22>&#x1f353;</text>
        </svg>"
    />
    <style>
      body {
        height: 100%;
        margin: 0;
        width: 100%;
        overflow: hidden;
      }

      #graphiql {
        height: 100vh;
        display: flex;
      }

      .docExplorerHide {
        display: none;
      }

      .doc-explorer-contents {
        overflow-y: hidden !important;
      }

      .docExplorerWrap {
        width: unset !important;
        min-width: unset !important;
      }

      .graphiql-explorer-actions select {
        margin-left: 4px;
      }
    </style>

    <link rel="stylesheet" href="{% static 'graphiql/graphiql.css' %}"/>
  </head>

  <body>
    <div id="graphiql" class="graphiql-container">Loading...</div>
    <script type="module" src="{% static 'graphiql/graphiql.js' %}"></script>
  </body>
</html>

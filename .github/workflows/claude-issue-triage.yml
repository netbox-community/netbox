name: Claude Issue Triage

on:
  issues:
    types: [opened]

jobs:
  reason:
    # Gathers triage context deterministically, then produces a verdict with a
    # SINGLE, TOOL-LESS Anthropic API call. This job holds ANTHROPIC_API_KEY but:
    #   * the model is given NO tools, so a prompt injection in the issue body
    #     cannot read the runner filesystem/environment or post anything -- it can
    #     only return text; and
    #   * the GitHub token here is read-only (no issues: write), so nothing in this
    #     job can comment.
    # The secret and the write capability are never in the same job.
    if: github.repository == 'netbox-community/netbox'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      verdict: ${{ steps.triage.outputs.verdict }}
    steps:
      - name: Check out issue templates and triage script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/ISSUE_TEMPLATE
            .github/scripts/triage_issue.py
          sparse-checkout-cone-mode: false

      - name: Gather deterministic context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Title is untrusted, but it is passed as a quoted argument to gh search,
          # never evaluated as shell.
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ctx"
          cat .github/ISSUE_TEMPLATE/* > "$RUNNER_TEMP/ctx/templates.txt" 2>/dev/null || true
          gh release list --repo "$GITHUB_REPOSITORY" --limit 5 \
            > "$RUNNER_TEMP/ctx/releases.txt" 2>/dev/null || true
          gh search issues --repo "$GITHUB_REPOSITORY" --state open --limit 10 "$ISSUE_TITLE" \
            > "$RUNNER_TEMP/ctx/dups.txt" 2>/dev/null || true

      - name: Generate triage verdict
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TEMPLATES_PATH: ${{ runner.temp }}/ctx/templates.txt
          RELEASES_PATH: ${{ runner.temp }}/ctx/releases.txt
          DUP_CANDIDATES_PATH: ${{ runner.temp }}/ctx/dups.txt
        run: |
          set -euo pipefail
          verdict="$(python .github/scripts/triage_issue.py)"
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"

  comment:
    # Posts the comment. Holds the GitHub token (issues: write) but NO Anthropic
    # key -- there is no secret here to exfiltrate. The verdict body is treated
    # strictly as data (--body-file), never interpolated into a shell command.
    needs: reason
    if: ${{ fromJSON(needs.reason.outputs.verdict).should_comment }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Post triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VERDICT_JSON: ${{ needs.reason.outputs.verdict }}
        run: |
          set -euo pipefail
          printf '%s' "$VERDICT_JSON" \
            | python -c 'import json,sys,pathlib; pathlib.Path("body.md").write_text(json.load(sys.stdin).get("body",""))'
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file body.md
